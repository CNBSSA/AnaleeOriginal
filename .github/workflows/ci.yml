name: CI

# Runs the test suite (incl. the canary smoke journey) on every push and PR.
# The suite is self-contained: tests/conftest.py provides DATABASE_URL (temp
# SQLite) and FLASK_SECRET_KEY and removes ANTHROPIC_API_KEY, so no secrets are
# needed. In CI the real flask_migrate/flask_apscheduler are installed, so the
# conftest's local stubs are not used.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        run: pytest tests/ -q

  migrate-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analee
          POSTGRES_PASSWORD: test
          POSTGRES_DB: analee_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://analee:test@localhost:5432/analee_migration_test
      FLASK_SECRET_KEY: ci-migration-gate-secret
      ANALEE_SKIP_BOOT_SCHEMA: '1'
      FLASK_APP: migrate_app.py
      ANALEE_POSTGRES_MIGRATION_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Apply migrations on empty PostgreSQL (production-equivalent path)
        run: flask db upgrade
      - name: Verify migrated schema
        run: pytest tests/test_postgres_migrations.py -q
